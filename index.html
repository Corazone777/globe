<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IBEX Staffing Solutions - Global Network</title>
    <script src="https://cdn.babylonjs.com/babylon.js"></script>
    <style>
        /* --- GLOBAL RESET & FONTS --- */
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=Rajdhani:wght@500;600;700;800&display=swap');
        
        html, body {
            overflow: hidden;
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            background-color: #0d1117;
            font-family: 'Inter', sans-serif;
            color: white;
        }

        #renderCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            touch-action: none;
            outline: none;
            z-index: 1; 
        }

        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10; 
            pointer-events: none; 
            display: flex;
            flex-direction: column;
        }

        /* --- NAVBAR HEADER --- */
        header {
            pointer-events: auto; 
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.2rem 4rem;
            background: linear-gradient(180deg, rgba(8, 12, 20, 0.9) 0%, rgba(8, 12, 20, 0.3) 100%);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(0, 255, 204, 0.15);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5);
            z-index: 100;
        }

        .brand-container {
            display: flex;
            align-items: center;
            gap: 15px;
            text-decoration: none;
        }

        .logo {
            height: 35px;
            max-width: 150px; 
        }

        .brand-text {
            font-family: 'Rajdhani', sans-serif;
            font-size: 1.4rem;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            background: linear-gradient(90deg, #ffffff, #00ffcc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .desktop-nav {
            display: flex;
            gap: 2.5rem;
            align-items: center;
        }

        .desktop-nav a, .mobile-menu a {
            color: #8fa3b0;
            text-decoration: none;
            font-family: 'Rajdhani', sans-serif;
            font-size: 1.05rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            transition: all 0.3s ease;
            position: relative;
        }

        .desktop-nav a:hover, .mobile-menu a:hover {
            color: #ffffff;
            text-shadow: 0 0 10px rgba(0, 255, 204, 0.6);
        }

        .desktop-nav a:not(.roi-btn)::after {
            content: '';
            position: absolute;
            width: 0;
            height: 2px;
            bottom: -6px;
            left: 0;
            background-color: #00ffcc;
            transition: width 0.3s ease;
            box-shadow: 0 0 8px #00ffcc;
        }

        .desktop-nav a:hover::after { width: 100%; }

        .roi-btn {
            background: rgba(255, 179, 25, 0.1);
            border: 1px solid rgba(255, 179, 25, 0.5);
            padding: 8px 20px;
            border-radius: 4px;
            color: #ffb319 !important; 
        }

        .roi-btn:hover {
            background: rgba(255, 179, 25, 0.2);
            border-color: #ffb319;
            box-shadow: 0 0 15px rgba(255, 179, 25, 0.4), inset 0 0 10px rgba(255, 179, 25, 0.2);
            text-shadow: none;
        }

        .hamburger {
            display: none;
            flex-direction: column;
            justify-content: space-between;
            width: 30px;
            height: 21px;
            background: transparent;
            border: none;
            cursor: pointer;
            padding: 0;
            z-index: 101; 
        }

        .hamburger span {
            width: 100%;
            height: 3px;
            background-color: #00ffcc;
            border-radius: 10px;
            transition: all 0.3s linear;
            transform-origin: 1px;
        }

        .hamburger.open span:nth-child(1) { transform: rotate(45deg); }
        .hamburger.open span:nth-child(2) { opacity: 0; transform: translateX(20px); }
        .hamburger.open span:nth-child(3) { transform: rotate(-45deg); }

        .mobile-menu {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            background: rgba(8, 12, 20, 0.95);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 2rem;
            z-index: 90; 
            opacity: 0;
            transform: translateY(-100%);
            transition: all 0.4s ease-in-out;
            pointer-events: none;
        }

        .mobile-menu.open {
            opacity: 1;
            transform: translateY(0);
            pointer-events: auto; 
        }

        /* --- HERO FOOTER TYPOGRAPHY --- */
        .hero-footer {
            position: absolute;
            bottom: 8%; /* Sits nicely above the bottom edge */
            left: 0;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            z-index: 50;
            pointer-events: none; /* Let clicks pass through to the globe */
        }

        .hero-title {
            margin: 0;
            font-family: 'Rajdhani', sans-serif;
            font-size: 3.5rem;
            font-weight: 800;
            letter-spacing: 6px;
            text-transform: uppercase;
            color: #ffffff;
            /* Cinematic text shadow ensures it remains readable over bright background lines */
            text-shadow: 0 4px 20px rgba(0, 0, 0, 0.9), 0 2px 5px rgba(0, 0, 0, 0.8);
        }

        .hero-subtitle {
            margin: 0;
            font-family: 'Inter', sans-serif;
            font-size: 1.1rem;
            font-weight: 400;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: #00ffcc; /* Matches the vibrant Teal dots */
            text-shadow: 0 0 15px rgba(0, 255, 204, 0.5), 0 2px 10px rgba(0, 0, 0, 0.8);
        }

        /* --- RESPONSIVE BREAKPOINTS --- */
        @media (max-width: 1024px) {
            .hero-title { font-size: 2.8rem; letter-spacing: 4px; }
            .hero-subtitle { font-size: 1rem; letter-spacing: 3px; }
        }

        @media (max-width: 900px) {
            header { padding: 1.2rem 2rem; }
            .desktop-nav { gap: 1.5rem; }
        }

        @media (max-width: 768px) {
            .desktop-nav { display: none; } 
            .hamburger { display: flex; }   
            .brand-text { font-size: 1.1rem; }
            .hero-title { font-size: 1.8rem; letter-spacing: 2px; text-align: center; padding: 0 10px; }
            .hero-subtitle { font-size: 0.8rem; letter-spacing: 2px; text-align: center; padding: 0 10px; }
            .hero-footer { bottom: 6%; }
        }
    </style>
</head>
<body>
    <canvas id="renderCanvas"></canvas>

    <div id="ui-layer">
        <header>
            <a href="#" class="brand-container">
                <img src="IBEXlogo.svg" alt="" class="logo" onerror="this.style.display='none'">
                <div class="brand-text">IBEX Staffing</div>
            </a>
            
            <nav class="desktop-nav">
                <a href="#">About Ibex</a>
                <a href="#">Talent Solutions</a>
                <a href="#">Customer Care</a>
                <a href="#">Blog</a>
                <a href="#" class="roi-btn">ROI Calculator</a>
            </nav>

            <button class="hamburger" id="hamburger-btn">
                <span></span>
                <span></span>
                <span></span>
            </button>
        </header>
        
        <div class="mobile-menu" id="mobile-menu">
            <a href="#">About Ibex</a>
            <a href="#">Talent Solutions</a>
            <a href="#">Customer Care</a>
            <a href="#">Blog</a>
            <a href="#" class="roi-btn">ROI Calculator</a>
        </div>

        <div class="hero-footer">
            <h1 class="hero-title">IBEX Staffing Solutions</h1>
            <h2 class="hero-subtitle">Your Gateway to Elite Global Talent</h2>
        </div>
    </div>

    <script>
        const hamburgerBtn = document.getElementById('hamburger-btn');
        const mobileMenu = document.getElementById('mobile-menu');
        hamburgerBtn.addEventListener('click', () => {
            hamburgerBtn.classList.toggle('open');
            mobileMenu.classList.toggle('open');
        });
    </script>

    <script>
        const canvas = document.getElementById("renderCanvas");
        const engine = new BABYLON.Engine(canvas, true, { preserveDrawingBuffer: true, stencil: true });
        let camera; 

        const createScene = function () {
            const scene = new BABYLON.Scene(engine);
            scene.clearColor = new BABYLON.Color4(0.05, 0.06, 0.09, 1);

            camera = new BABYLON.ArcRotateCamera("camera", -Math.PI / 2, Math.PI / 2.5, 4.5, BABYLON.Vector3.Zero(), scene);
            
            // THE FIX: Move the camera target slightly down. This pushes the globe UP on the screen, 
            // making perfect room for the new title at the bottom!
            camera.target = new BABYLON.Vector3(0, -0.2, 0);

            camera.attachControl(canvas, true);
            camera.wheelPrecision = 50;
            camera.lowerRadiusLimit = 2.5;
            camera.upperRadiusLimit = 15;
            camera.panningSensibility = 0;

            const hemLight = new BABYLON.HemisphericLight("hemLight", new BABYLON.Vector3(0, 1, 0), scene);
            hemLight.intensity = 1.8; 
            
            const skyboxTexture = new BABYLON.EquiRectangularCubeTexture("NightSkyHDRI009_4K_TONEMAPPED.jpg", scene, 1024);
            const skybox = scene.createDefaultSkybox(skyboxTexture, true, 1000, 0);

            const earthRoot = new BABYLON.TransformNode("earthRoot", scene);
            const dataRoot = new BABYLON.TransformNode("dataRoot", scene);
            dataRoot.parent = earthRoot;
            dataRoot.rotation.y = Math.PI; 

            const glowLayer = new BABYLON.GlowLayer("glow", scene);
            glowLayer.intensity = 0.9; 

            const innerSphere = BABYLON.MeshBuilder.CreateSphere("innerSphere", { diameter: 1.98, segments: 64 }, scene);
            const coreMat = new BABYLON.StandardMaterial("coreMat", scene);
            coreMat.alpha = 0.2; 
            coreMat.disableLighting = true; 
            coreMat.emissiveFresnelParameters = new BABYLON.FresnelParameters();
            coreMat.emissiveFresnelParameters.bias = 0.15;
            coreMat.emissiveFresnelParameters.power = 3;
            coreMat.emissiveFresnelParameters.leftColor = new BABYLON.Color3(0.0, 0.5, 1.0); 
            coreMat.emissiveFresnelParameters.rightColor = BABYLON.Color3.Black(); 
            innerSphere.material = coreMat;
            innerSphere.parent = earthRoot;

            const outerSphere = BABYLON.MeshBuilder.CreateSphere("outerSphere", { diameter: 2.005, segments: 64 }, scene);
            const landMat = new BABYLON.PBRMaterial("landMat", scene);
            landMat.metallic = 0.8;
            landMat.roughness = 0.4; 
            landMat.albedoColor = new BABYLON.Color3(0.05, 0.15, 0.25); 
            landMat.emissiveColor = new BABYLON.Color3(0.01, 0.05, 0.1); 

            const maskTexture = new BABYLON.Texture("globe.png", scene);
            maskTexture.getAlphaFromRGB = true; 
            maskTexture.vScale = -1; 
            maskTexture.uScale = -1; 
            landMat.opacityTexture = maskTexture;
            landMat.transparencyMode = BABYLON.PBRMaterial.PBRMATERIAL_ALPHABLEND;

            const normalTexture = new BABYLON.Texture("normal.png", scene);
            normalTexture.vScale = -1; 
            normalTexture.uScale = -1; 
            normalTexture.level = 5.0; 
            landMat.bumpTexture = normalTexture;
            
            outerSphere.material = landMat;
            outerSphere.parent = earthRoot;

            const atmosSphere = BABYLON.MeshBuilder.CreateSphere("atmosSphere", { diameter: 2.15, segments: 64 }, scene);
            const atmosMat = new BABYLON.StandardMaterial("atmosMat", scene);
            atmosMat.emissiveColor = new BABYLON.Color3(0.0, 0.5, 1.0); 
            atmosMat.alpha = 0.05; 
            atmosMat.emissiveFresnelParameters = new BABYLON.FresnelParameters();
            atmosMat.emissiveFresnelParameters.bias = 0.1;
            atmosMat.emissiveFresnelParameters.power = 5; 
            atmosMat.emissiveFresnelParameters.leftColor = BABYLON.Color3.White();
            atmosMat.emissiveFresnelParameters.rightColor = BABYLON.Color3.Black();
            atmosMat.disableLighting = true;
            atmosSphere.material = atmosMat;
            atmosSphere.parent = earthRoot;

            const particleMesh = BABYLON.MeshBuilder.CreateSphere("particle", { diameter: 0.008, segments: 4 }, scene);
            const particleMat = new BABYLON.StandardMaterial("particleMat", scene);
            particleMat.disableLighting = true;
            particleMat.emissiveColor = BABYLON.Color3.White(); 
            particleMesh.material = particleMat;
            particleMesh.parent = dataRoot; 
            glowLayer.addIncludedOnlyMesh(particleMesh);

            const techHubs = [
                { name: "New York", lat: 40.71, lon: -74.00 },
                { name: "London", lat: 51.50, lon: -0.12 },
                { name: "San Francisco", lat: 37.77, lon: -122.41 },
                { name: "Tokyo", lat: 35.67, lon: 139.65 },
                { name: "Bangalore", lat: 12.97, lon: 77.59 },
                { name: "Sydney", lat: -33.86, lon: 151.20 },
                { name: "Sao Paulo", lat: -23.55, lon: -46.63 },
                { name: "Berlin", lat: 52.52, lon: 13.40 }
            ];

            function getCoordsFromLatLon(lat, lon, radius) {
                const u = (lon + 180) / 360;
                const v = (90 - lat) / 180;
                const theta = u * 2 * Math.PI - Math.PI;
                const phi = v * Math.PI;
                const px = radius * Math.sin(phi) * Math.cos(theta);
                const py = radius * Math.cos(phi);
                const pz = radius * Math.sin(phi) * Math.sin(theta);
                return new BABYLON.Vector3(px, py, pz);
            }

            const img = new Image();
            img.src = "globe.png";
            
            const landPoints = []; 
            const hubPoints = [];  

            techHubs.forEach(hub => {
                const pos = getCoordsFromLatLon(hub.lat, hub.lon, 1.02); 
                hubPoints.push(pos);

                const marker = BABYLON.MeshBuilder.CreateTorus("hub_" + hub.name, {diameter: 0.04, thickness: 0.005, tessellation: 16}, scene);
                marker.position = pos;
                marker.lookAt(BABYLON.Vector3.Zero()); 
                const markerMat = new BABYLON.StandardMaterial("markerMat", scene);
                markerMat.emissiveColor = new BABYLON.Color3(1.0, 0.7, 0.1); 
                markerMat.disableLighting = true;
                marker.material = markerMat;
                marker.parent = dataRoot;
                glowLayer.addIncludedOnlyMesh(marker);
            });

            img.onload = () => {
                try {
                    const tempCanvas = document.createElement("canvas");
                    tempCanvas.width = 200; 
                    tempCanvas.height = 100; 
                    const ctx = tempCanvas.getContext("2d", { willReadFrequently: true });
                    ctx.drawImage(img, 0, 0, tempCanvas.width, tempCanvas.height);
                    
                    const imgData = ctx.getImageData(0, 0, tempCanvas.width, tempCanvas.height).data;
                    const matricesData = [];
                    const colorData = []; 
                    
                    const radius = 1.025; 

                    for (let y = 0; y < tempCanvas.height; y++) {
                        for (let x = 0; x < tempCanvas.width; x++) {
                            const index = (y * tempCanvas.width + x) * 4;
                            if (imgData[index] > 128 && imgData[index + 3] > 10) { 
                                let u = x / tempCanvas.width;
                                let v = y / tempCanvas.height;
                                
                                const theta = u * 2 * Math.PI - Math.PI;
                                const phi = v * Math.PI;                 

                                const px = radius * Math.sin(phi) * Math.cos(theta);
                                const py = radius * Math.cos(phi);
                                const pz = radius * Math.sin(phi) * Math.sin(theta);

                                const pos = new BABYLON.Vector3(px, py, pz);
                                landPoints.push(pos);

                                const pointScale = 0.5 + (Math.random() * 0.4); 
                                const matrix = BABYLON.Matrix.Compose(
                                    new BABYLON.Vector3(pointScale, pointScale, pointScale),
                                    BABYLON.Quaternion.Identity(),
                                    pos
                                );
                                matrix.copyToArray(matricesData, matricesData.length);
                                
                                const randColor = Math.random();
                                let r = 0.0, g = 1.0, b = 0.8, a = 0.9;

                                if (randColor > 0.98) {
                                    r = 1.0; g = 0.7; b = 0.1; a = 1.0;
                                } else if (randColor > 0.90) {
                                    r = 1.0; g = 1.0; b = 1.0; a = 0.9;
                                } else if (randColor > 0.70) {
                                    r = 0.0; g = 0.5; b = 1.0; a = 0.7;
                                }

                                colorData.push(r, g, b, a); 
                            }
                        }
                    }

                    if (matricesData.length > 0) {
                        particleMesh.thinInstanceSetBuffer("matrix", new Float32Array(matricesData), 16);
                        particleMesh.thinInstanceSetBuffer("color", new Float32Array(colorData), 4);
                        
                        generateFlawlessSemanticArcs(landPoints, hubPoints);
                    }
                } catch (e) { console.error("Canvas read error.", e); }
            };

            const movingPacketsParent = new BABYLON.TransformNode("movingPackets", scene);
            movingPacketsParent.parent = dataRoot;
            const packetAnimations = [];
            
            function createPacket(color, size) {
                const packet = BABYLON.MeshBuilder.CreateSphere("packet", { diameter: size, segments: 4 }, scene);
                const mat = new BABYLON.StandardMaterial("packetMat", scene);
                mat.emissiveColor = color;
                mat.disableLighting = true;
                packet.material = mat;
                packet.parent = movingPacketsParent;
                glowLayer.addIncludedOnlyMesh(packet);
                return packet;
            }

            function generateFlawlessSemanticArcs(allDots, hubs) {
                const createArc = (p1, p2, color, thickness, packetSize) => {
                    const distance = BABYLON.Vector3.Distance(p1, p2);
                    const heightFactor = 1.0 + (distance * 0.4); 
                    const cp1 = p1.scale(heightFactor);
                    const cp2 = p2.scale(heightFactor);

                    const curvePoints = BABYLON.Curve3.CreateCubicBezier(p1, cp1, cp2, p2, 40).getPoints();
                    const arcLine = BABYLON.MeshBuilder.CreateLines("arc", {points: curvePoints}, scene);
                    arcLine.color = color;
                    arcLine.alpha = thickness; 
                    arcLine.parent = dataRoot;
                    glowLayer.addIncludedOnlyMesh(arcLine);

                    packetAnimations.push({
                        mesh: createPacket(color, packetSize),
                        path: curvePoints,
                        speed: 0.005 + (Math.random() * 0.005),
                        alpha: Math.random()
                    });
                };

                for (let i = 0; i < hubs.length; i++) {
                    for (let j = i + 1; j < hubs.length; j++) {
                        if (Math.random() > 0.6) {
                            createArc(hubs[i], hubs[j], new BABYLON.Color3(1.0, 0.7, 0.1), 0.7, 0.02);
                        }
                    }
                    
                    for (let k = 0; k < 5; k++) {
                        let randomLandNode = allDots[Math.floor(Math.random() * allDots.length)];
                        if (BABYLON.Vector3.Distance(hubs[i], randomLandNode) < 1.2) {
                             createArc(hubs[i], randomLandNode, new BABYLON.Color3(0.0, 0.8, 1.0), 0.2, 0.01);
                        }
                    }
                }
            }

            scene.onBeforeRenderObservable.add(() => {
                earthRoot.rotation.y += 0.0008; 

                for(let animation of packetAnimations) {
                    animation.alpha += animation.speed;
                    if(animation.alpha > 1.0) animation.alpha = 0.0; 
                    
                    const maxIdx = animation.path.length - 1;
                    const exactIdx = animation.alpha * maxIdx;
                    const pointIndex = Math.floor(exactIdx);
                    const nextPointIndex = Math.min(Math.ceil(exactIdx), maxIdx); 
                    const interPointAlpha = exactIdx - pointIndex;
                    
                    animation.mesh.position = BABYLON.Vector3.Lerp(animation.path[pointIndex], animation.path[nextPointIndex], interPointAlpha);
                }
            });

            return scene;
        };

        const scene = createScene();

        const updateCameraZoom = () => {
            if (!camera) return;
            if (window.innerWidth <= 768) {
                camera.radius = 6.5; 
            } else if (window.innerWidth <= 1024) {
                camera.radius = 5.5; 
            } else {
                camera.radius = 4.5; 
            }
        };

        engine.runRenderLoop(function () { 
            scene.render(); 
        });

        updateCameraZoom();
        window.addEventListener("resize", function () { 
            engine.resize(); 
            updateCameraZoom();
        });
    </script>
</body>
</html>
